databaseChangeLog:
  - changeSet:
      id: 2025140402
      author: Antipin Egor
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: user
                  type: bigint
                  constraints:
                    foreignKeyName: user_fk
                    referencedTableName: users
                    referencedColumnNames: id