version: "3.9"

services:
  postgresdb:
    image: postgres
    env_file: ./.env
    environment:
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASS}
        POSTGRES_DB: ${DB_NAME}
    ports:
      - ${DB_LOCAL_PORT}:${DB_DOCKER_PORT}
    volumes:
      - db:/var/lib/postgres
volumes:
  db:



