databaseChangeLog:
  - changeSet:
      id: 2025140403
      author: Antipin Egor
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(32)
                  constraints:
                    nullable: false
        - createTable:
            tableName: roles_user
            columns:
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    foreignKeyName: user_id_fk
                    referencedTableName: users
                    referencedColumnNames: id
              - column:
                  name: role_id
                  type: bigint
                  constraints:
                    foreignKeyName: role_id_fk
                    referencedTableName: roles
                    referencedColumnNames: id

